name: Nightly (erweiterte Tests)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Anzahl generierter Quelldateien (pain.seeds)'
        default: '5000'

permissions:
  contents: read

jobs:
  # Läuft nur, wenn sich seit dem letzten erfolgreichen Nightly etwas geändert hat.
  # Manuelle Starts laufen immer. Ist der letzte Lauf fehlgeschlagen, wird erneut getestet.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manueller Start"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
            --branch "$GITHUB_REF_NAME" --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""')
          echo "Letzter erfolgreicher Nightly: ${LAST:-keiner} / aktuell: $GITHUB_SHA"
          if [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "Keine Änderungen, Nightly wird übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  extended-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Erweiterte Tests
        run: ./mvnw -B -ntp test -Dpain.seeds=${{ inputs.seeds || '5000' }}

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-nightly
          path: target/surefire-reports/
